<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1020" />
    <meta name="color-scheme" content="dark light" />
    <title>NexLink</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  </head>
  <body>
    <div id="nl-splash" class="nl-splash" aria-label="NexLink">
      <div class="nl-splash-glow"></div>
      <div class="nl-splash-card">
        <div class="nl-splash-orbit nl-splash-orbit-a"></div>
        <div class="nl-splash-orbit nl-splash-orbit-b"></div>
        <div class="nl-splash-mark">N</div>
        <div class="nl-splash-title">Nex<span>Link</span></div>
        <div class="nl-splash-sub">Сообщения · Голос · Приватность</div>
        <div class="nl-splash-loader"><span></span></div>
      </div>
    </div>
    <div id="nl-root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
